name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, plus current LTS and latest.
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Type errors should fail the build even though `npm test` also compiles.
      - name: Type-check and build
        run: npm run build

      # Both suites stub fetch, so CI never touches the live financial APIs —
      # no network flakiness, no rate limits, no secrets required.
      - name: Test
        run: npm test
